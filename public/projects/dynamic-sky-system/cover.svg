<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000">
  <!-- SAMPLE cover: replace with a real webm/mp4 capture -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0">
        <animate attributeName="stop-color" values="#0b1d3a;#2d6fb3;#e0795a;#0b1d3a" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="1">
        <animate attributeName="stop-color" values="#1c2a4a;#9fd1f5;#ffc27a;#1c2a4a" dur="8s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <radialGradient id="sun"><stop offset="0" stop-color="#fff6d8"/><stop offset=".35" stop-color="#ffd27a"/><stop offset="1" stop-color="#ffd27a" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="1600" height="1000" fill="url(#sky)"/>
  <g fill="#fff">
    <animate attributeName="opacity" values="1;0;0;1" dur="8s" repeatCount="indefinite"/>
    <circle cx="200" cy="120" r="2"/><circle cx="420" cy="220" r="1.5"/><circle cx="640" cy="90" r="2"/><circle cx="980" cy="160" r="1.5"/>
    <circle cx="1220" cy="80" r="2"/><circle cx="1400" cy="240" r="1.5"/><circle cx="760" cy="300" r="1.2"/><circle cx="1500" cy="120" r="1.8"/>
  </g>
  <circle r="140" fill="url(#sun)">
    <animateMotion dur="8s" repeatCount="indefinite" path="M-100 820 Q800 -250 1700 820"/>
  </circle>
  <path d="M0 760 L180 640 L330 720 L520 560 L700 700 L860 610 L1040 730 L1220 590 L1420 700 L1600 620 V1000 H0Z" fill="#0f1a2b" opacity=".85"/>
  <path d="M0 850 L240 760 L420 820 L640 740 L900 830 L1120 760 L1360 840 L1600 780 V1000 H0Z" fill="#07101c"/>
  <g font-family="ui-monospace, Menlo, Consolas, monospace" font-size="22" fill="#e8eef7">
    <rect x="48" y="44" width="360" height="118" rx="12" fill="#07101c" opacity=".55"/>
    <text x="72" y="86">BP_DynamicSky</text>
    <text x="72" y="124" fill="#9fb2c8">TimeOfDay
      <tspan fill="#7cc4ff"><animate attributeName="opacity" values="1;.4;1" dur="1s" repeatCount="indefinite"/>▲ 0.02 h/s</tspan>
    </text>
    <text x="1552" y="950" text-anchor="end" fill="#9fb2c8">SkyAtmosphere · VolumetricCloud · UE5</text>
  </g>
</svg>
